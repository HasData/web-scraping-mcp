[project]
name = "hasdata-web-scraping-mcp"
version = "1.0.0"
description = "MCP server for HasData's Web Scraping API. 1,000 free credits every month."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp","web-scraping","scraper","proxy","headless-browser","model-context-protocol","hasdata"]
# mcp is pinned below 2 because mcp-proxy 0.12.0 imports request_ctx, removed in the mcp 2.x SDK.
dependencies = ["mcp-proxy>=0.12.0", "mcp>=1.28.1,<2"]

[project.urls]
Homepage = "https://hasdata.com/web-scraping-api"
Repository = "https://github.com/HasData/web-scraping-mcp"

[project.scripts]
hasdata-web-scraping-mcp = "hasdata_web_scraping_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hasdata_web_scraping_mcp"]
